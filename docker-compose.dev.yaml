# Dev overrides: hot reload for server (air) and web (vite dev server).
# Usage: make dev  (or: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d)
name: drawboard

services:
  server:
    build: !reset null
    image: golang:1.23-bookworm
    working_dir: /src/packages/server
    volumes:
      - .:/src
      - go_cache:/go
    environment:
      DATABASE_URL: postgres://drawboard:${POSTGRES_PASSWORD:-drawboard}@db:5432/drawboard?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      ADDR: ":8080"
      DATA_DIR: /tmp/drawboard-data
      MARKETPLACE_DIR: marketplace
      GOCACHE: /go/.cache/go-build
    command: sh -c "command -v air >/dev/null 2>&1 || go install github.com/air-verse/air@v1.61.7; exec air"
    ports:
      - "${SERVER_PORT:-18080}:8080"

  web:
    build: !reset null
    image: node:20-bookworm
    working_dir: /web
    volumes:
      - ./packages/web:/web
      - web_node_modules:/web/node_modules
    environment:
      # vite proxies API/WS to the server container; polling is required for
      # file watching over macOS bind mounts.
      VITE_API_TARGET: http://server:8080
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: !override
      - "${WEB_PORT:-8080}:5173"
    depends_on:
      - server

volumes:
  go_cache:
  web_node_modules:
