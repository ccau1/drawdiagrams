apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drawboard.fullname" . }}-server
  labels:
    {{ include "drawboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: {{ include "drawboard.image" (dict "image" .Values.server.image) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: DATABASE_URL
              value: {{ include "drawboard.databaseUrl" . | quote }}
            - name: MARKETPLACE_DIR
              value: packages/server/marketplace
            - name: LOCAL_AUTH_REGISTRATION_ENABLED
              value: {{ .Values.server.auth.registrationEnabled | quote }}
            {{- if or .Values.server.jwtSecret .Values.jwt.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawboard.jwtSecretName" . }}
                  key: secret
            {{- end }}
            {{- if and .Values.server.auth.initialUsername .Values.server.auth.initialPassword }}
            - name: LOCAL_AUTH_INITIAL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawboard.localAuthSecretName" . }}
                  key: username
            - name: LOCAL_AUTH_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawboard.localAuthSecretName" . }}
                  key: password
            {{- if .Values.server.auth.initialEmail }}
            - name: LOCAL_AUTH_INITIAL_EMAIL
              value: {{ .Values.server.auth.initialEmail | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.server.oauth.enabled }}
            - name: OAUTH_LOCAL_ENABLED
              value: {{ .Values.server.oauth.localEnabled | quote }}
            {{- if .Values.server.oauth.redirectUrl }}
            - name: OAUTH_REDIRECT_URL
              value: {{ .Values.server.oauth.redirectUrl | quote }}
            {{- end }}
            {{- range $provider, $cfg := .Values.server.oauth.providers }}
            - name: OAUTH_{{ upper $provider }}_ENABLED
              value: {{ $cfg.enabled | quote }}
            {{- if $cfg.clientId }}
            - name: OAUTH_{{ upper $provider }}_CLIENT_ID
              value: {{ $cfg.clientId | quote }}
            {{- end }}
            {{- if $cfg.clientSecret }}
            - name: OAUTH_{{ upper $provider }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawboard.fullname" $ }}-oauth
                  key: {{ $provider }}-client-secret
            {{- end }}
            {{- if $cfg.redirectUrl }}
            - name: OAUTH_{{ upper $provider }}_REDIRECT_URL
              value: {{ $cfg.redirectUrl | quote }}
            {{- end }}
            {{- if $cfg.issuer }}
            - name: OAUTH_{{ upper $provider }}_ISSUER
              value: {{ $cfg.issuer | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.server.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/integrations
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/integrations
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- if .Values.server.extraVolumeMounts }}
          volumeMounts: {{ .Values.server.extraVolumeMounts | toYaml | nindent 12 }}
          {{- end }}
          resources: {{ .Values.server.resources | toYaml | nindent 12 }}
      {{- if .Values.server.extraVolumes }}
      volumes: {{ .Values.server.extraVolumes | toYaml | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drawboard.fullname" . }}-server
  labels: {{ include "drawboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: 8080
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
