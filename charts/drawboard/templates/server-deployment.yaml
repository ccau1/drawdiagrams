apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drawboard.fullname" . }}-server
  labels:
    {{ include "drawboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: DATABASE_URL
              value: {{ include "drawboard.databaseUrl" . | quote }}
            - name: MARKETPLACE_DIR
              value: packages/server/marketplace
            {{- if or .Values.server.jwtSecret .Values.jwt.existingSecret }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "drawboard.jwtSecretName" . }}
                  key: secret
            {{- end }}
            {{- range $k, $v := .Values.server.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/integrations
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/integrations
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{ .Values.server.resources | toYaml | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drawboard.fullname" . }}-server
  labels: {{ include "drawboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: 8080
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
