# Full stack: Postgres + Go server + nginx web.
# Usage: make up / make down  (or: docker compose up -d --build)
name: drawboard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drawboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drawboard}
      POSTGRES_DB: drawboard
    volumes:
      - ./__pg_data__:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: ${SERVER_IMAGE:-drawboard/server}:${SERVER_TAG:-latest}
    environment:
      DATABASE_URL: postgres://drawboard:${POSTGRES_PASSWORD:-drawboard}@db:5432/drawboard?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      ADDR: ":8080"
      OAUTH_LOCAL_ENABLED: ${OAUTH_LOCAL_ENABLED:-true}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GOOGLE_REDIRECT_URL: ${OAUTH_GOOGLE_REDIRECT_URL:-}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-false}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GITHUB_REDIRECT_URL: ${OAUTH_GITHUB_REDIRECT_URL:-}
      OAUTH_FACEBOOK_ENABLED: ${OAUTH_FACEBOOK_ENABLED:-false}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_REDIRECT_URL: ${OAUTH_FACEBOOK_REDIRECT_URL:-}
      OAUTH_OKTA_ENABLED: ${OAUTH_OKTA_ENABLED:-false}
      OAUTH_OKTA_CLIENT_ID: ${OAUTH_OKTA_CLIENT_ID:-}
      OAUTH_OKTA_CLIENT_SECRET: ${OAUTH_OKTA_CLIENT_SECRET:-}
      OAUTH_OKTA_REDIRECT_URL: ${OAUTH_OKTA_REDIRECT_URL:-}
      OAUTH_OKTA_ISSUER: ${OAUTH_OKTA_ISSUER:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/integrations >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: ${WEB_IMAGE:-drawboard/web}:${WEB_TAG:-latest}
    environment:
      SERVER_HOST: server
      SERVER_PORT: "8080"
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
